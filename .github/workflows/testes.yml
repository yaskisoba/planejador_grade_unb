name: Testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    name: Suítes Prolog, Python e Elm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Executar suítes integradas
        run: docker compose run --build --rm testes
