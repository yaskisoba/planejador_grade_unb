[project]

name="backend"
version ="0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "janus-swi>=1.5.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
start = "server:main"

[build-system]
requires =["hatchling"]
build-backend ="hatchling.build"
[tool.hatch.build.targets.wheel]
include =["server.py"]
