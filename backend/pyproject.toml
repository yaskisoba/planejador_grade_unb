[project]

name="backend"
version ="0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "janus-swi>=1.5.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
start = "server:main"

[build-system]
requires =["hatchling"]
build-backend ="hatchling.build"
[tool.hatch.build.targets.wheel]
include =["server.py"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os testes não usam plugins externos. Evita carregar plugins do ROS ou de
# outras ferramentas expostas pelo ambiente da máquina.
addopts = "--disable-plugin-autoload"
